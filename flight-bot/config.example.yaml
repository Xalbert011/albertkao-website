# 機票監控機器人設定檔
# 使用方式：複製此檔案為 config.yaml，填入你的資訊後執行 python flight_monitor.py

# ── SerpAPI（https://serpapi.com 免費申請，支援 Google 帳號登入）───────────
serpapi:
  api_key: "YOUR_SERPAPI_KEY"

# ── Email 通知（以 Gmail 為例）─────────────────────────────────────────────
# Gmail 需先至 Google 帳號 > 安全性 > 兩步驗證，再建立「應用程式密碼」（16 碼）
email:
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  username: "your_gmail@gmail.com"
  password: "your_16_char_app_password"
  from: "your_gmail@gmail.com"
  to: "your_gmail@gmail.com"

# ── CSV 歷史紀錄路徑 ─────────────────────────────────────────────────────
history_csv: "price_history.csv"

# ── 監控的航線 ────────────────────────────────────────────────────────────
routes:
  - origin: "TPE"
    destination: "NRT"
    depart_date: "2026-08-01"
    return_date: "2026-08-08"
    threshold_price: 8000
    currency: "TWD"

  - origin: "TPE"
    destination: "BKK"
    depart_date: "2026-09-01"
    return_date: "2026-09-08"
    threshold_price: 6000
    currency: "TWD"

  - origin: "TPE"
    destination: "LAX"
    depart_date: "2026-12-20"
    return_date: "2027-01-05"
    threshold_price: 28000
    currency: "TWD"
